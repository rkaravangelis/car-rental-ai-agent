<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#191919"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F4E79"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background + title -->
  <rect width="1000" height="640" rx="18" fill="#FAFAFA"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#191919">System Design</text>
  <rect x="30" y="50" width="44" height="4" fill="#1F4E79"/>

  <!-- Docker boundary -->
  <rect x="20" y="72" width="770" height="548" rx="14" fill="none" stroke="#BDBDBD" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="36" y="94" font-size="12" fill="#6B6B6B">Docker Compose</text>

  <!-- 1. Frontend -->
  <g filter="url(#shadow)">
    <rect x="45" y="110" width="180" height="96" rx="10" fill="#fff" stroke="#E2E2E2"/>
    <rect x="45" y="110" width="180" height="5" rx="2" fill="#1F4E79"/>
  </g>
  <text x="135" y="143" text-anchor="middle" font-size="15" font-weight="700" fill="#191919">Frontend</text>
  <text x="135" y="163" text-anchor="middle" font-size="12" fill="#555">Streamlit · :8501</text>
  <text x="135" y="183" text-anchor="middle" font-size="11" fill="#6B6B6B">chat + golden answers</text>

  <!-- 2. API -->
  <g filter="url(#shadow)">
    <rect x="270" y="110" width="180" height="96" rx="10" fill="#fff" stroke="#E2E2E2"/>
    <rect x="270" y="110" width="180" height="5" rx="2" fill="#1F4E79"/>
  </g>
  <text x="360" y="143" text-anchor="middle" font-size="15" font-weight="700" fill="#191919">API</text>
  <text x="360" y="163" text-anchor="middle" font-size="12" fill="#555">FastAPI · :8000</text>
  <text x="360" y="183" text-anchor="middle" font-size="11" fill="#6B6B6B">POST /chat</text>

  <line x1="225" y1="158" x2="266" y2="158" stroke="#191919" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="158" x2="491" y2="158" stroke="#191919" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 3. Agent (LangGraph) -->
  <g filter="url(#shadow)">
    <rect x="495" y="110" width="270" height="262" rx="10" fill="#fff" stroke="#E2E2E2"/>
    <rect x="495" y="110" width="270" height="5" rx="2" fill="#1F4E79"/>
  </g>
  <text x="630" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#191919">Agent · LangGraph</text>

  <!-- graph nodes: name left, detail right -->
  <g font-size="12">
    <rect x="520" y="156" width="220" height="34" rx="17" fill="#EAF1F8" stroke="#C9DCEE"/>
    <text x="538" y="177" font-weight="700" fill="#191919">route_region</text>
    <text x="724" y="177" text-anchor="end" font-size="11" fill="#6B6B6B">Arizona / General</text>

    <rect x="520" y="206" width="220" height="34" rx="17" fill="#EAF1F8" stroke="#C9DCEE"/>
    <text x="538" y="227" font-weight="700" fill="#191919">retrieve</text>
    <text x="724" y="227" text-anchor="end" font-size="11" fill="#6B6B6B">HyDE + region filter</text>

    <rect x="520" y="256" width="220" height="34" rx="17" fill="#EAF1F8" stroke="#C9DCEE"/>
    <text x="538" y="277" font-weight="700" fill="#191919">answer</text>
    <text x="724" y="277" text-anchor="end" font-size="11" fill="#6B6B6B">validated by guardrails</text>

    <rect x="520" y="306" width="220" height="34" rx="17" fill="#191919"/>
    <text x="538" y="327" font-weight="700" fill="#fff">refund / account</text>
    <text x="724" y="327" text-anchor="end" font-size="11" fill="#4A7FB5">via MCP</text>
  </g>
  <line x1="630" y1="190" x2="630" y2="203" stroke="#191919" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="630" y1="240" x2="630" y2="253" stroke="#191919" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="630" y1="290" x2="630" y2="303" stroke="#191919" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Guardrails side note -->
  <g>
    <rect x="300" y="248" width="170" height="52" rx="8" fill="#fff" stroke="#1F8A5B" stroke-width="1.4"/>
    <text x="385" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#1F8A5B">Guardrails</text>
    <text x="385" y="287" text-anchor="middle" font-size="11" fill="#555">schema · rules · retry</text>
  </g>
  <line x1="470" y1="273" x2="517" y2="273" stroke="#1F8A5B" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- 4. LLM outside Docker -->
  <g filter="url(#shadow)">
    <rect x="815" y="196" width="165" height="110" rx="10" fill="#191919"/>
  </g>
  <text x="897" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">LLM</text>
  <text x="897" y="250" text-anchor="middle" font-size="12" fill="#4A7FB5">gpt-oss:120b-cloud</text>
  <text x="897" y="270" text-anchor="middle" font-size="11" fill="#BDBDBD">via Ollama app</text>
  <text x="897" y="287" text-anchor="middle" font-size="11" fill="#BDBDBD">on the laptop</text>
  <line x1="740" y1="223" x2="811" y2="236" stroke="#1F4E79" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowO)"/>
  <line x1="740" y1="273" x2="811" y2="266" stroke="#1F4E79" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowO)"/>
  <text x="776" y="213" text-anchor="middle" font-size="10" fill="#1F4E79">HyDE</text>
  <text x="776" y="292" text-anchor="middle" font-size="10" fill="#1F4E79">answer</text>

  <!-- 5. MCP server -->
  <g filter="url(#shadow)">
    <rect x="540" y="400" width="180" height="56" rx="10" fill="#fff" stroke="#E2E2E2"/>
  </g>
  <text x="630" y="423" text-anchor="middle" font-size="13" font-weight="700" fill="#191919">MCP server · stdio</text>
  <text x="630" y="442" text-anchor="middle" font-size="11" fill="#555">create_refund · get_account</text>
  <line x1="630" y1="340" x2="630" y2="396" stroke="#191919" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 6. Database -->
  <g filter="url(#shadow)">
    <rect x="270" y="470" width="495" height="140" rx="10" fill="#fff" stroke="#E2E2E2"/>
  </g>
  <text x="492" y="540" text-anchor="middle" font-size="13" font-weight="700" fill="#191919">Postgres</text>
  <text x="492" y="557" text-anchor="middle" font-size="13" font-weight="700" fill="#191919">+ pgvector</text>
  <text x="492" y="576" text-anchor="middle" font-size="11" fill="#6B6B6B">db · :5433</text>

  <!-- cylinder: chunks -->
  <g>
    <path d="M330 528 v56 a50 10 0 0 0 100 0 v-56" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.4"/>
    <ellipse cx="380" cy="528" rx="50" ry="10" fill="#C9DCEE" stroke="#1F4E79" stroke-width="1.4"/>
    <text x="380" y="563" text-anchor="middle" font-size="12" font-weight="700" fill="#191919">chunks</text>
    <text x="380" y="578" text-anchor="middle" font-size="10" fill="#555">vector store</text>
  </g>
  <!-- cylinder: ledger -->
  <g>
    <path d="M555 528 v56 a75 10 0 0 0 150 0 v-56" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.4"/>
    <ellipse cx="630" cy="528" rx="75" ry="10" fill="#C9DCEE" stroke="#1F4E79" stroke-width="1.4"/>
    <text x="630" y="557" text-anchor="middle" font-size="12" font-weight="700" fill="#191919">ledger</text>
    <text x="630" y="572" text-anchor="middle" font-size="10" fill="#555">accounts · transactions</text>
    <text x="630" y="585" text-anchor="middle" font-size="10" fill="#555">balances (view)</text>
  </g>

  <!-- retrieve -> chunks -->
  <path d="M520 223 H490 V380 H380 V514" fill="none" stroke="#191919" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- MCP -> ledger -->
  <line x1="630" y1="456" x2="630" y2="514" stroke="#191919" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Ingestion (offline) -->
  <g filter="url(#shadow)">
    <rect x="45" y="482" width="180" height="122" rx="10" fill="#fff" stroke="#E2E2E2" stroke-dasharray="5 4"/>
  </g>
  <text x="135" y="510" text-anchor="middle" font-size="14" font-weight="700" fill="#191919">Ingestion</text>
  <text x="135" y="528" text-anchor="middle" font-size="11" fill="#6B6B6B">runs once on start</text>
  <text x="135" y="556" text-anchor="middle" font-size="11" fill="#555">2 policy PDFs</text>
  <text x="135" y="572" text-anchor="middle" font-size="11" fill="#555">→ chunks → MiniLM</text>
  <text x="135" y="588" text-anchor="middle" font-size="11" fill="#555">embeddings</text>
  <line x1="225" y1="556" x2="326" y2="556" stroke="#191919" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
