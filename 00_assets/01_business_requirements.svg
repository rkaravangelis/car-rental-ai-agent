<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F4E79"/>
      <stop offset="1" stop-color="#4A7FB5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" rx="18" fill="#FAFAFA"/>

  <!-- Roof -->
  <polygon points="60,118 500,28 940,118" fill="url(#roof)"/>
  <rect x="60" y="118" width="880" height="18" fill="#191919"/>
  <text x="500" y="88" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">AI Customer Service Agent</text>
  <text x="500" y="110" text-anchor="middle" font-size="13" fill="#FFFFFF" opacity="0.9">Car Rental MVP</text>

  <!-- ===== Pillar template: x = 80, 250, 420, 590, 760 · width 160 ===== -->

  <!-- Pillar 1: Chat UI -->
  <g transform="translate(80,156)" filter="url(#shadow)">
    <rect width="160" height="300" rx="12" fill="#FFFFFF" stroke="#E6E6E6"/>
    <rect width="160" height="6" rx="3" fill="#1F4E79"/>
    <circle cx="80" cy="64" r="34" fill="#EAF1F8"/>
    <!-- chat icon -->
    <path d="M58 48 h34 a6 6 0 0 1 6 6 v18 a6 6 0 0 1 -6 6 h-20 l-10 9 v-9 h-4 a6 6 0 0 1 -6 -6 v-18 a6 6 0 0 1 6 -6 z" fill="#1F4E79"/>
    <circle cx="66" cy="63" r="2.6" fill="#fff"/><circle cx="75" cy="63" r="2.6" fill="#fff"/><circle cx="84" cy="63" r="2.6" fill="#fff"/>
    <text x="80" y="132" text-anchor="middle" font-size="30" font-weight="800" fill="#1F4E79">01</text>
    <text x="80" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#191919">Chat Interface</text>
    <line x1="40" y1="178" x2="120" y2="178" stroke="#EEE"/>
    <text x="80" y="202" text-anchor="middle" font-size="12.5" fill="#555">Agent resolves</text>
    <text x="80" y="220" text-anchor="middle" font-size="12.5" fill="#555">customer issues</text>
    <rect x="12" y="242" width="136" height="34" rx="17" fill="#191919"/>
    <text x="80" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Knows its limits</text>
  </g>

  <!-- Pillar 2: Policy grounding -->
  <g transform="translate(250,156)" filter="url(#shadow)">
    <rect width="160" height="300" rx="12" fill="#FFFFFF" stroke="#E6E6E6"/>
    <rect width="160" height="6" rx="3" fill="#1F4E79"/>
    <circle cx="80" cy="64" r="34" fill="#EAF1F8"/>
    <!-- document icon -->
    <path d="M64 40 h22 l12 12 v34 a4 4 0 0 1 -4 4 h-30 a4 4 0 0 1 -4 -4 v-42 a4 4 0 0 1 4 -4 z" fill="#1F4E79"/>
    <path d="M86 40 v12 h12 z" fill="#FFB98C"/>
    <rect x="67" y="60" width="24" height="3" rx="1.5" fill="#fff"/>
    <rect x="67" y="68" width="24" height="3" rx="1.5" fill="#fff"/>
    <rect x="67" y="76" width="16" height="3" rx="1.5" fill="#fff"/>
    <text x="80" y="132" text-anchor="middle" font-size="30" font-weight="800" fill="#1F4E79">02</text>
    <text x="80" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#191919">Policy Grounding</text>
    <line x1="40" y1="178" x2="120" y2="178" stroke="#EEE"/>
    <text x="80" y="202" text-anchor="middle" font-size="12.5" fill="#555">Answers only from</text>
    <text x="80" y="220" text-anchor="middle" font-size="12.5" fill="#555">the policy PDF</text>
    <rect x="12" y="242" width="136" height="34" rx="17" fill="#191919"/>
    <text x="80" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">RAG · No invention</text>
  </g>

  <!-- Pillar 3: Refund via MCP -->
  <g transform="translate(420,156)" filter="url(#shadow)">
    <rect width="160" height="300" rx="12" fill="#FFFFFF" stroke="#E6E6E6"/>
    <rect width="160" height="6" rx="3" fill="#1F4E79"/>
    <circle cx="80" cy="64" r="34" fill="#EAF1F8"/>
    <!-- database icon -->
    <ellipse cx="72" cy="48" rx="16" ry="6" fill="#1F4E79"/>
    <path d="M56 48 v28 a16 6 0 0 0 32 0 v-28 a16 6 0 0 1 -32 0 z" fill="#1F4E79"/>
    <path d="M56 58 a16 6 0 0 0 32 0" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M56 67 a16 6 0 0 0 32 0" fill="none" stroke="#fff" stroke-width="2"/>
    <!-- euro coin -->
    <circle cx="100" cy="82" r="11" fill="#191919"/>
    <text x="100" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">€</text>
    <text x="80" y="132" text-anchor="middle" font-size="30" font-weight="800" fill="#1F4E79">03</text>
    <text x="80" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#191919">Refund via MCP</text>
    <line x1="40" y1="178" x2="120" y2="178" stroke="#EEE"/>
    <text x="80" y="202" text-anchor="middle" font-size="12.5" fill="#555">Company refunds customer</text>
    <text x="80" y="220" text-anchor="middle" font-size="12.5" fill="#555">1 refund = 1 DB row</text>
    <rect x="12" y="242" width="136" height="34" rx="17" fill="#191919"/>
    <text x="80" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">MCP tool call</text>
  </g>

  <!-- Pillar 4: Guardrails -->
  <g transform="translate(590,156)" filter="url(#shadow)">
    <rect width="160" height="300" rx="12" fill="#FFFFFF" stroke="#E6E6E6"/>
    <rect width="160" height="6" rx="3" fill="#1F4E79"/>
    <circle cx="80" cy="64" r="34" fill="#EAF1F8"/>
    <!-- shield icon -->
    <path d="M80 40 l22 8 v14 c0 14 -9 24 -22 30 c-13 -6 -22 -16 -22 -30 v-14 z" fill="#1F4E79"/>
    <path d="M70 64 l7 7 l13 -14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="132" text-anchor="middle" font-size="30" font-weight="800" fill="#1F4E79">04</text>
    <text x="80" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#191919">Guardrails</text>
    <line x1="40" y1="178" x2="120" y2="178" stroke="#EEE"/>
    <text x="80" y="202" text-anchor="middle" font-size="12.5" fill="#555">Rules &amp; tests validate</text>
    <text x="80" y="220" text-anchor="middle" font-size="12.5" fill="#555">every LLM output</text>
    <rect x="12" y="242" width="136" height="34" rx="17" fill="#191919"/>
    <text x="80" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Block refund &gt; €100</text>
  </g>

  <!-- Pillar 5: Evaluation -->
  <g transform="translate(760,156)" filter="url(#shadow)">
    <rect width="160" height="300" rx="12" fill="#FFFFFF" stroke="#E6E6E6"/>
    <rect width="160" height="6" rx="3" fill="#1F4E79"/>
    <circle cx="80" cy="64" r="34" fill="#EAF1F8"/>
    <!-- bar chart icon -->
    <rect x="60" y="66" width="9" height="20" rx="2" fill="#1F4E79"/>
    <rect x="73" y="54" width="9" height="32" rx="2" fill="#1F4E79"/>
    <rect x="86" y="44" width="9" height="42" rx="2" fill="#1F4E79"/>
    <rect x="56" y="88" width="44" height="3" rx="1.5" fill="#191919"/>
    <text x="80" y="132" text-anchor="middle" font-size="30" font-weight="800" fill="#1F4E79">05</text>
    <text x="80" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#191919">Evaluation</text>
    <line x1="40" y1="178" x2="120" y2="178" stroke="#EEE"/>
    <text x="80" y="202" text-anchor="middle" font-size="12.5" fill="#555">Tokens in / out</text>
    <text x="80" y="220" text-anchor="middle" font-size="12.5" fill="#555">Cost per answer</text>
    <rect x="12" y="242" width="136" height="34" rx="17" fill="#191919"/>
    <text x="80" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Is it correct?</text>
  </g>

  <!-- Foundation / Objective -->
  <rect x="60" y="474" width="880" height="14" fill="#191919"/>
  <rect x="40" y="492" width="920" height="46" rx="10" fill="#191919"/>
  <text x="72" y="521" font-size="13" font-weight="700" letter-spacing="1.5" fill="#4A7FB5">OBJECTIVE</text>
  <text x="545" y="521" text-anchor="middle" font-size="15" fill="#FFFFFF">Resolve customer issues from policy documents – grounded, safe and at a known cost</text>
</svg>
